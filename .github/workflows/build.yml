name: Build .deb Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
 build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build amd64 .deb
        run: |
          docker run --rm \
            -e NEMESIS_ROOT=/src \
            -v "$PWD":/src \
            python:3.12 \
            bash -c '
              apt-get update -qq && apt-get install -y -qq dpkg binutils > /dev/null 2>&1
              pip install --quiet pyinstaller rich prompt_toolkit httpx pydantic pyyaml pyperclip
              DEB_ARCH=amd64 PYINST_ARCH=x86_64 python3 /src/scripts/ci_build.py
            '

      - uses: actions/upload-artifact@v4
        with:
          name: nemesis-cli_amd64
          path: dist_amd64/*.deb

  build-i386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build i386 .deb
        run: |
          docker run --rm \
            --platform linux/386 \
            -e NEMESIS_ROOT=/src \
            -v "$PWD":/src \
            i386/python:3.12 \
            bash -c '
              apt-get update -qq && apt-get install -y -qq dpkg binutils gcc > /dev/null 2>&1
              pip install --quiet pyinstaller rich prompt_toolkit httpx pydantic pyyaml pyperclip
              DEB_ARCH=i386 PYINST_ARCH=x86 python3 /src/scripts/ci_build.py
            '

      - uses: actions/upload-artifact@v4
        with:
          name: nemesis-cli_i386
          path: dist_i386/*.deb

  release:
    needs: [build-amd64, build-i386]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release/
      - run: find release/ -name '*.deb' -ls

      - uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.deb
          generate_release_notes: true
