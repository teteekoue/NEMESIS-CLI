name: Build 32-bit DEB

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build in 32-bit Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app i386/debian:bullseye /bin/bash -c "
            apt-get update && apt-get install -y python3-pip python3-venv dpkg gcc libc6-dev
            python3 -m venv venv
            source venv/bin/activate
            pip install pyinstaller -r requirements.txt
            pyinstaller --onefile --name nemesis-cli agent_modular.py
            
            # Déplacement vers la structure de package
            mkdir -p package/usr/bin
            cp dist/nemesis-cli package/usr/bin/
            
            # Construction du paquet
            dpkg-deb --build package nemesis-cli_2.0.0_i386.deb
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nemesis-deb-32bit
          path: nemesis-cli_2.0.0_i386.deb
